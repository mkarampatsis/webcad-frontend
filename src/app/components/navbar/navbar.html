<header
  class="w-full top-0 sticky bg-surface border-b border-outline-variant z-50 flex items-center justify-between px-margin-desktop h-16">
  <div class="flex items-center gap-4">
    <span class="material-symbols-outlined text-primary text-2xl" data-icon="architecture">architecture</span>
    <div class="flex flex-col">
      <h1 class="font-headline-sm text-headline-sm font-bold text-primary">Project: Metro-Bridge-2024</h1>
      <span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest">Structural /
        Foundation</span>
    </div>
  </div>
  <nav class="hidden md:flex items-center gap-8">
    <a 
      class="text-on-surface-variant hover:bg-secondary-container transition-colors px-3 py-1 rounded cursor-pointer" 
      routerLink="home" 
      routerLinkActive="text-primary font-bold transition-colors cursor-pointer active:opacity-80">Home
    </a>
    <a 
      class="text-on-surface-variant hover:bg-secondary-container transition-colors px-3 py-1 rounded cursor-pointer"  
      routerLink="about" 
      routerLinkActive="text-primary font-bold transition-colors cursor-pointer active:opacity-80">About Us
    </a>
    <a 
      class="text-on-surface-variant hover:bg-secondary-container transition-colors px-3 py-1 rounded cursor-pointer"
      routerLink="cad-workspace"
      routerLinkActive="text-primary font-bold transition-colors cursor-pointer active:opacity-80">Workspace
    </a>
    <a 
      class="text-on-surface-variant hover:bg-secondary-container transition-colors px-3 py-1 rounded cursor-pointer"
      routerLink="than-cad"
      routerLinkActive="text-primary font-bold transition-colors cursor-pointer active:opacity-80">ThanCAD
    </a>
    <a 
      class="text-on-surface-variant hover:bg-secondary-container transition-colors px-3 py-1 rounded cursor-pointer"
      routerLink="skyciv-renderer"
      routerLinkActive="text-primary font-bold transition-colors cursor-pointer active:opacity-80">SkyCiv
    </a>
    <a 
      class="text-on-surface-variant hover:bg-secondary-container transition-colors px-3 py-1 rounded cursor-pointer"
      routerLink="login"
      (click)="loginPage('signup')"
      routerLinkActive="text-primary font-bold transition-colors cursor-pointer active:opacity-80">Register
    </a>
    <a 
      class="text-on-surface-variant hover:bg-secondary-container transition-colors px-3 py-1 rounded cursor-pointer"
      routerLink="contact"
      routerLinkActive="text-primary font-bold transition-colors cursor-pointer active:opacity-80">Contact
    </a>
  </nav>
  <div class="group relative w-10 h-10 rounded-full border border-outline-variant cursor-pointer active:opacity-80 bg-surface-container flex items-center justify-center">
    @if (this.user()) {
      <img class="w-full h-full object-cover overflow-hidden" [src]="user()!.photoUrl" alt="user photo" />
    } @else {
      <span class="material-symbols-outlined" routerLink="login" (click)="loginPage('login')">login</span>

      <span class="absolute top-full left-1/2 -translate-x-1/2 mt-2
        invisible opacity-0 group-hover:visible group-hover:opacity-100
        transition-opacity duration-200
        whitespace-nowrap rounded-lg bg-secondary-container px-2 py-1
        text-xs text-on-surface-variant z-50 pointer-events-none">
      Login
    </span>
    }
        
  </div>
</header>
